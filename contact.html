<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>联系我们｜北京音响灯光 LED 屏租赁咨询报价｜在线询盘</title>
    <meta
      name="keywords"
      content="北京舞台设备租赁电话，音响灯光租赁报价，LED 屏租赁咨询，北京视听设备仓库地址"
    />
    <meta
      name="description"
      content="昱宇科技联系电话：159‑1023‑9102，手机微信：159‑1023‑9102，办公位于北京朝阳区，提交在线询盘表单，24 小时内为您出具定制化活动方案与报价。"
    />
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body data-page="contact">
    <div id="site-header-mount"></div>
    <main>
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow">联系我们</span>
          <h1>联系我们｜欢迎咨询获取定制方案</h1>
          <p>提供您的活动需求，24 小时内给到定制方案，专业团队全程保障执行。</p>
        </div>
      </section>

      <section class="section">
        <div class="container contact-layout">
          <aside class="contact-info reveal">
            <h2>联系方式</h2>
            <ul>
              <li>
                <span>手机微信</span>
                <a href="tel:15910239102">159-1023-9102</a>
              </li>
              <li>
                <span>商务邮箱</span>
                <a href="mailto:584538661@qq.com">584538661@qq.com</a>
              </li>
              <li>
                <span>办公地址</span>
                <strong>北京市朝阳区十里河新华国际广场A1201</strong>
              </li>
            </ul>
            <div class="contact-wechat">
              <img src="public/wechat-qr.jpg" alt="微信二维码" width="160" height="160" />
              <p>微信扫码添加好友，快速咨询方案与报价</p>
            </div>
            <div class="contact-map">
              <img
                src="public/images/photo-1524661135-423995f22d0b.jpg"
                alt="北京朝阳区示意"
              />
              <p>北京及周边城市，支持外埠项目，大型活动可全国上门执行。</p>
            </div>
          </aside>

          <form class="contact-form reveal reveal-delay-1" id="inquiry-form">
            <h2>提交活动需求，免费获取方案</h2>
            <div class="contact-form__grid">
              <label>
                您的姓名 *
                <input name="name" placeholder="请输入姓名" required />
              </label>
              <label>
                联系电话 / 微信 *
                <input name="phone" placeholder="请输入手机或微信号" required />
              </label>
              <label>
                活动名称
                <input name="eventName" placeholder="如：企业年会" />
              </label>
              <label>
                活动时间
                <input type="date" name="eventDate" />
              </label>
              <label>
                活动地点
                <input name="location" placeholder="城市 / 场馆" />
              </label>
              <label>
                预计人数
                <input name="people" placeholder="如：500" />
              </label>
            </div>

            <fieldset>
              <legend>需要服务</legend>
              <div class="contact-services">
                <label class="check"><input type="checkbox" name="services" value="音响" /><span>音响</span></label>
                <label class="check"><input type="checkbox" name="services" value="灯光" /><span>灯光</span></label>
                <label class="check"><input type="checkbox" name="services" value="LED 屏" /><span>LED 屏</span></label>
                <label class="check"><input type="checkbox" name="services" value="全套打包" /><span>全套打包</span></label>
                <label class="check"><input type="checkbox" name="services" value="其他" /><span>其他</span></label>
              </div>
            </fieldset>

            <label>
              需求描述（预算、特殊要求）
              <textarea name="desc" rows="5" placeholder="请描述活动规模、预算区间或特殊技术要求"></textarea>
            </label>

            <button type="submit" class="btn btn--primary">提交咨询</button>
            <p class="form-msg form-msg--ok">提交成功！我们已通知管理员，将尽快与您联系。</p>
            <p class="form-msg form-msg--error">请至少填写姓名与联系电话。</p>
          </form>
        </div>
      </section>
    </main>
    <div id="site-footer-mount"></div>
    <script src="js/form-config.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
